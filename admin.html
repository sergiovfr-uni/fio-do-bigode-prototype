<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fio do Bigode Admin</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f1eb}#adminFrame{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
  <iframe id="adminFrame" title="Fio do Bigode Admin"></iframe>
  <script>
    const frame=document.getElementById('adminFrame');
    frame.src='admin/';
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        if(!doc||doc.getElementById('fdbAdminFinalAdjustmentsScript'))return;
        const script=doc.createElement('script');
        script.id='fdbAdminFinalAdjustmentsScript';
        script.src='../admin-final-adjustments.js?v=20260829';
        doc.head.appendChild(script);
      }catch(error){console.error('Não foi possível carregar os ajustes administrativos.',error)}
    });
  </script>
</body>
</html>
