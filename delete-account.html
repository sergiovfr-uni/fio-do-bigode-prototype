<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fio do Bigode • Excluir conta</title><style>body{font-family:system-ui;background:#f5f4f1;margin:0;color:#151515}.wrap{max-width:520px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #e4e0d7;border-radius:18px;padding:20px}.input,.btn{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;margin:7px 0;font:inherit}.input{border:1px solid #ccc}.btn{border:0;background:#111;color:#fff;font-weight:800}.muted{font-size:13px;color:#666;line-height:1.5}.danger{background:#8f1717}</style></head><body><div class="wrap"><h1>Excluir conta Fio do Bigode</h1><div class="card"><p class="muted">Esta página permite solicitar exclusão mesmo fora do aplicativo. Após autenticar, a conta será bloqueada e a solicitação registrada. Dados sujeitos a obrigação legal de retenção poderão ser preservados pelo prazo aplicável.</p><input id="email" class="input" type="email" placeholder="E-mail"><input id="password" class="input" type="password" placeholder="Senha"><textarea id="reason" class="input" rows="3" placeholder="Motivo (opcional)"></textarea><button class="btn danger" onclick="removeAccount()">Solicitar exclusão da conta</button><div id="status" class="muted"></div></div><p class="muted"><a href="privacy.html">Política de Privacidade</a></p></div><script>const API='https://fio-do-bigode-prototype-production.up.railway.app/api/v1';async function removeAccount(){if(!confirm('Confirma a solicitação de exclusão da conta?'))return;status.textContent='Autenticando...';try{let r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});let j=await r.json();if(!r.ok)throw new Error(j.message||'Não foi possível autenticar.');const token=j.token;r=await fetch(API+'/compliance/account-deletion',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({reason:reason.value||'Solicitação pela página pública'})});j=await r.json();if(!r.ok)throw new Error(j.message||'Não foi possível registrar.');status.textContent=j.message||'Solicitação registrada.'}catch(e){status.textContent=e.message}}</script></body></html>
