name: Build Android AAB

concurrency:
  group: aab-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install reproducible dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/fio-do-bigode-upload.jks

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF
          FDB_UPLOAD_STORE_FILE=fio-do-bigode-upload.jks
          FDB_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          FDB_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS
          FDB_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          debug_block = '''        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }'''
          release_block = debug_block + '''
        release {
            storeFile file(FDB_UPLOAD_STORE_FILE)
            storePassword FDB_UPLOAD_STORE_PASSWORD
            keyAlias FDB_UPLOAD_KEY_ALIAS
            keyPassword FDB_UPLOAD_KEY_PASSWORD
        }'''
          text = text.replace(debug_block, release_block)
          marker = 'signingConfig signingConfigs.debug'
          position = text.rfind(marker)
          if position < 0:
              raise RuntimeError('Release signing configuration was not found')
          text = text[:position] + 'signingConfig signingConfigs.release' + text[position + len(marker):]
          path.write_text(text)
          PY

      - name: Build signed app bundle
        run: chmod +x gradlew && ./gradlew clean bundleRelease
        working-directory: mobile/android

      - name: Verify bundle signature
        run: jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: fio-do-bigode-v0.6.5-build17-google-play
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
