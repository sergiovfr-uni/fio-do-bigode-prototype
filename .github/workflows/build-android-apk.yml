name: Gerar APK Android

concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  push:
    branches:
      - feat/first-integrated-apk
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Compilar APK independente de homologação
        run: ./gradlew assembleRelease
        working-directory: mobile/android

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: fio-do-bigode-v0.5.1-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
