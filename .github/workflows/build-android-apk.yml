name: Gerar APK Android

concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  push:
    branches:
      - main
      - cleanup-v0.6.1
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Compilar APK de homologação
        run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android

      - name: Assinar APK explicitamente
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out android/app/build/outputs/apk/debug/fio-do-bigode-homologacao.apk \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verificar assinatura do APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/fio-do-bigode-homologacao.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: fio-do-bigode-v0.6.1-homologacao-assinado-apk
          path: mobile/android/app/build/outputs/apk/debug/fio-do-bigode-homologacao.apk
          if-no-files-found: error
          retention-days: 14
