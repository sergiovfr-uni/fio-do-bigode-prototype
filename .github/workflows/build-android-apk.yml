name: Gerar APK Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'
  push:
    branches:
      - feat/first-integrated-apk
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Compilar APK de homologação
        run: ./gradlew assembleDebug
        working-directory: mobile/android

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: fio-do-bigode-v0.5.0-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
