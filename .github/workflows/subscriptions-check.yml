name: Subscription checks
on:
  push:
    branches: [feat/launch-trial-influencers]
  pull_request:
    paths: ['backend/laravel/**']
permissions:
  contents: read
jobs:
  subscriptions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/laravel
    steps:
      - uses: actions/checkout@v4
      - run: php -v && php -m | grep -i sqlite
      - run: mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: find app config database tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/subscriptions.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - run: php tests/partners.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - run: php tests/public-access.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - run: php tests/early-payoff.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

  early-payoff-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fdb_payoff_ci
          MYSQL_USER: fdb_ci
          MYSQL_PASSWORD: fdb_ci_only
          MYSQL_ROOT_PASSWORD: fdb_root_ci_only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend/laravel
    steps:
      - uses: actions/checkout@v4
      - run: php -m | grep -i pdo_mysql
      - run: mkdir -p bootstrap/cache storage/framework/{cache/data,sessions,views} storage/logs
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php tests/early-payoff.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PAYOFF_TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
