<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Fio do Bigode</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#fff}
  </style>
</head>
<body>
  <iframe id="appFrame" title="Fio do Bigode" allow="camera; microphone; clipboard-read; clipboard-write" referrerpolicy="same-origin"></iframe>
  <script>
    const frame=document.getElementById('appFrame');
    const target='live.html'+location.search+location.hash;
    frame.src=target;
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        if(!doc||doc.getElementById('fdbFinalAdjustmentsScript'))return;
        const script=doc.createElement('script');
        script.id='fdbFinalAdjustmentsScript';
        script.src='final-adjustments.js?v=20260829';
        doc.head.appendChild(script);
      }catch(error){console.error('Não foi possível carregar os ajustes finais.',error)}
    });
  </script>
</body>
</html>
