<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fio do Bigode</title>
  <style>html,body,#appFrame{margin:0;width:100%;height:100%;border:0;background:#f4f1eb}body{overflow:hidden}</style>
</head>
<body>
  <iframe id="appFrame" title="Fio do Bigode"></iframe>
  <script>
    const frame=document.getElementById('appFrame');
    frame.src='live.html'+location.search+location.hash;
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        if(!doc)return;
        if(!doc.getElementById('fdbFinalAdjustmentsScript')){
          const script=doc.createElement('script');
          script.id='fdbFinalAdjustmentsScript';
          script.src='final-adjustments.js?v=20260901-final1';
          doc.body.appendChild(script);
        }
        if(!doc.getElementById('fdbRuntimeFixesScript')){
          const runtime=doc.createElement('script');
          runtime.id='fdbRuntimeFixesScript';
          runtime.src='runtime-fixes.js?v=20260901-final1';
          doc.body.appendChild(runtime);
        }
      }catch(_){ }
    });
  </script>
</body>
</html>
