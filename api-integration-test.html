<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fio do Bigode • API Integration Test</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#111;color:#fff;margin:0;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:#1d1d1d;border:1px solid #333;border-radius:16px;padding:18px;margin:12px 0}.ok{color:#5ad77a}.bad{color:#ff6b6b}.gold{color:#e1aa27}.muted{color:#aaa;font-size:13px}pre{white-space:pre-wrap;word-break:break-word;background:#0a0a0a;padding:12px;border-radius:10px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}</style></head><body><div class="wrap"><h1>Fio do Bigode <span class="gold">API Test</span></h1><p class="muted">Página isolada para validar GitHub Pages → Railway → Laravel → MySQL sem mexer no protótipo v0.4.7.</p><div class="card"><h3>Conectividade</h3><div id="health">Testando...</div></div><div class="card"><h3>Classificados públicos</h3><div id="listings">Carregando...</div></div><div class="card"><h3>Campanhas da Home</h3><div id="campaigns">Carregando...</div></div><button onclick="run()">Testar novamente</button><div class="card"><h3>Diagnóstico bruto</h3><pre id="raw"></pre></div></div><script>const API='https://fio-do-bigode-prototype-production.up.railway.app';async function call(path){const r=await fetch(API+path,{headers:{Accept:'application/json'}});const text=await r.text();let body;try{body=JSON.parse(text)}catch{body=text}if(!r.ok)throw new Error(r.status+' '+JSON.stringify(body));return body}async function run(){const raw={};health.textContent='Testando...';health.className='';listings.textContent='Carregando...';campaigns.textContent='Carregando...';try{const h=await call('/api/health');raw.health=h;health.textContent='✓ API online • banco '+h.database;health.className='ok'}catch(e){raw.health_error=e.message;health.textContent='✕ '+e.message;health.className='bad'}try{const l=await call('/api/v1/listings');raw.listings=l;const rows=l.data||l;listings.innerHTML=rows.length?rows.map(x=>`<div><b>${x.title}</b> • R$ ${Number(x.price).toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>`).join(''):'API respondeu corretamente • nenhum anúncio publicado ainda.'}catch(e){raw.listings_error=e.message;listings.innerHTML='<span class="bad">✕ '+e.message+'</span>'}try{const c=await call('/api/v1/campaigns/home');raw.campaigns=c;campaigns.innerHTML=c.length?c.map(x=>`<div><b>${x.advertiser}</b> • ${x.headline}</div>`).join(''):'API respondeu corretamente • nenhuma campanha ativa ainda.'}catch(e){raw.campaigns_error=e.message;campaigns.innerHTML='<span class="bad">✕ '+e.message+'</span>'}document.getElementById('raw').textContent=JSON.stringify(raw,null,2)}run()</script></body></html>
