<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fio do Bigode • Auth Live</title><style>body{font-family:system-ui;margin:0;background:#f5f5f5;color:#111}.wrap{max-width:430px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin:14px 0}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800;margin-top:8px}.input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:6px 0 12px;box-sizing:border-box}.muted{color:#666;font-size:13px}.ok{color:#267a39}.bad{color:#a22}</style></head><body><div class="wrap"><h1>Fio do Bigode</h1><div class="muted">Homologação de cadastro, login e 2FA reais.</div><div class="card"><h2>Login</h2><input id="email" class="input" value="joao@fiodobigode.dev" placeholder="E-mail"><input id="password" class="input" type="password" value="FioDoBigode123" placeholder="Senha"><button class="btn" onclick="login()">Entrar</button><div id="loginStatus" class="muted"></div></div><div id="twofa" class="card" style="display:none"><h2>2FA</h2><div id="masked" class="muted"></div><input id="code" class="input" placeholder="000000"><button class="btn" onclick="verify()">Validar token</button><div id="twoStatus" class="muted"></div></div><div id="session" class="card" style="display:none"><h2>Sessão</h2><pre id="me"></pre><button class="btn" onclick="logout()">Sair</button></div></div><script>const API='https://fio-do-bigode-prototype-production.up.railway.app/api/v1';let challenge=null;let token=localStorage.getItem('fdb_token')||'';async function jsonFetch(url,opt={}){const r=await fetch(url,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.message||('HTTP '+r.status));return j}async function login(){loginStatus.textContent='Validando...';try{const j=await jsonFetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});challenge=j.challenge_id;twofa.style.display='block';masked.textContent='Código enviado para '+(j.masked_destination||'seu e-mail');if(j.homologation_code){code.value=j.homologation_code;twoStatus.textContent='Modo homologação: código preenchido automaticamente.'}loginStatus.textContent='Credenciais válidas.'}catch(e){loginStatus.textContent=e.message}}async function verify(){twoStatus.textContent='Validando token...';try{const j=await jsonFetch(API+'/auth/2fa/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge_id:challenge,code:code.value})});token=j.token;localStorage.setItem('fdb_token',token);twoStatus.textContent='2FA validado.';await loadMe()}catch(e){twoStatus.textContent=e.message}}async function loadMe(){if(!token)return;try{const j=await jsonFetch(API+'/me',{headers:{Authorization:'Bearer '+token}});session.style.display='block';me.textContent=JSON.stringify(j,null,2)}catch(e){localStorage.removeItem('fdb_token');token=''}}async function logout(){if(token)await fetch(API+'/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token}});localStorage.removeItem('fdb_token');location.reload()}loadMe();</script></body></html>
