<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fio do Bigode • Auth Live</title><style>body{font-family:system-ui;margin:0;background:#f5f5f5;color:#111}.wrap{max-width:430px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin:14px 0}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800;margin-top:8px}.input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;margin:6px 0 12px;box-sizing:border-box}.muted{color:#666;font-size:13px}</style></head><body><div class="wrap"><h1>Fio do Bigode</h1><div class="muted">Homologação de cadastro e login.</div><div class="card"><h2>Login</h2><input id="email" class="input" value="carlos.hml@fiodobigode.com.br" placeholder="E-mail"><input id="password" class="input" type="password" value="Bigode@2026" placeholder="Senha"><button class="btn" onclick="login()">Entrar</button><div id="loginStatus" class="muted"></div></div><div id="session" class="card" style="display:none"><h2>Sessão</h2><pre id="me"></pre><button class="btn" onclick="logout()">Sair</button></div></div><script>const API='https://fio-do-bigode-prototype-production.up.railway.app/api/v1';let token=localStorage.getItem('fdb_token')||'';async function jsonFetch(url,opt={}){const r=await fetch(url,opt);let j={};try{j=await r.json()}catch{}if(!r.ok){const details=j.errors?JSON.stringify(j.errors):'';throw new Error((j.message||('HTTP '+r.status))+(details?' • '+details:''))}return j}async function login(){loginStatus.textContent='Validando...';try{const j=await jsonFetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});if(!j.token)throw new Error('Backend ainda está exigindo 2FA. Aguarde o deploy do Railway e tente novamente.');token=j.token;localStorage.setItem('fdb_token',token);loginStatus.textContent='Login realizado.';await loadMe()}catch(e){loginStatus.textContent=e.message}}async function loadMe(){if(!token)return;try{const j=await jsonFetch(API+'/me',{headers:{Authorization:'Bearer '+token,'Accept':'application/json'}});session.style.display='block';me.textContent=JSON.stringify(j,null,2)}catch(e){localStorage.removeItem('fdb_token');token=''}}async function logout(){if(token)await fetch(API+'/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token,'Accept':'application/json'}});localStorage.removeItem('fdb_token');location.reload()}loadMe();</script></body></html>
